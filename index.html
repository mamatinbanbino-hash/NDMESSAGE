<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp SPA</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #E5DDD5;
        }
        .chat-container {
            overflow-y: auto;
            height: calc(100vh - 100px);
        }
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }
        .message.sent {
            background-color: #A0D3E8;
            align-self: flex-end;
        }
        .message.received {
            background-color: #D3E8A9;
            align-self: flex-start;
        }
    </style>
</head>
<body class="flex flex-col items-center">
    <div class="w-full max-w-lg p-5 rounded-lg shadow-md bg-white">
        <h1 class="text-2xl font-bold mb-4 text-center">WhatsApp SPA</h1>
        <div class="chat-container flex flex-col">
            <div id="messages" class="flex flex-col"></div>
        </div>
        <form id="messageForm" class="flex mt-4">
            <input type="text" id="messageInput" class="flex-grow p-2 border rounded-lg" placeholder="Type a message..." required>
            <button type="submit" class="ml-2 p-2 bg-blue-500 text-white rounded-lg">Send</button>
        </form>
    </div>

    <script>
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messagesDiv = document.getElementById('messages');

        messageForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const message = messageInput.value;
            addMessage(message, 'sent');
            messageInput.value = '';

            // Simulate receiving a response
            setTimeout(() => {
                addMessage('This is a response from the bot!', 'received');
            }, 1500);
        });

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Scroll to the bottom
        }
    </script>
</body>
</html>
